; .user.ini — Endurecimiento de la cookie de sesión (PHP-FPM / FastCGI en cPanel)
; Estas directivas las lee PHP automáticamente; NO requieren tocar el código.
; (Si tu PHP corriera como módulo de Apache, este archivo se ignora; avísame y
;  lo paso a código PHP.)

; La cookie de sesión no es accesible por JavaScript (mitiga robo por XSS).
session.cookie_httponly = 1

; La cookie NO viaja en peticiones de otros sitios (principal defensa CSRF).
session.cookie_samesite = "Lax"

; La cookie solo viaja por HTTPS. Tu sitio ya usa HTTPS, así que es correcto.
; (Si accedieras por http:// sin S, la sesión no funcionaría: fuerza HTTPS.)
session.cookie_secure = 1

; Evita fijación de sesión: rechaza IDs de sesión no generados por el servidor.
session.use_strict_mode = 1
session.use_only_cookies = 1

; Duración de la sesión en el servidor: ~2.5 h de inactividad.
; El frontend cierra sesión a las 2 h (main.js); este margen extra evita que el
; servidor expire la sesión ANTES que el temporizador del navegador.
session.gc_maxlifetime = 9000
